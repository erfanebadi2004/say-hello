on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install python and pip
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
        
      - name: Install Dependences
        run: |
          python -m pip install --upgrade pip
          pip install pytest
        
      - name : Test App
        run: pytest test_py.py
